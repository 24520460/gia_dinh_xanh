<!doctype html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch Hẹn Của Tôi - Gia Đình Xanh</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind Play CDN with Theme Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#005c55',
              dark: '#004742',
              light: '#007a71',
              50: '#e6f5f3'
            },
            secondary: {
              DEFAULT: '#a73a00',
              dark: '#852e00',
              light: '#c74700'
            },
            surface: '#faf8ff'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/animations.css" />
</head>
<body class="bg-[#FAF8FF] text-[#131B2E] min-h-screen flex flex-col font-sans">

  <!-- Top Navbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
    <div class="flex justify-between items-center w-full px-4 md:px-8 max-w-7xl mx-auto h-16">
      <div class="flex items-center gap-4">
        <a href="index.html" class="text-xl font-bold text-[#005C55] tracking-tight flex items-center gap-2">
          <span class="material-symbols-outlined text-[26px] text-[#005C55]" style="font-variation-settings: 'FILL' 1;">eco</span>
          <span>Gia Đình Xanh</span>
        </a>
        <span class="hidden sm:inline-block w-px h-5 bg-slate-200"></span>
        <span class="text-xs text-slate-500 font-semibold hidden sm:inline-block">Quản Lý Lịch Hẹn & Đánh Giá</span>
      </div>

      <nav class="hidden lg:flex items-center gap-6 text-sm font-semibold">
        <a href="index.html" class="text-slate-600 hover:text-[#005C55] transition-colors">Trang chủ</a>
        <a href="customer-booking.html" class="text-slate-600 hover:text-[#005C55] transition-colors">Đặt lịch mới</a>
        <a href="customer-appointments.html" class="text-[#005C55] border-b-2 border-[#005C55] pb-1">Lịch hẹn của tôi</a>
      </nav>

      <a href="customer-booking.html" class="bg-[#005C55] hover:bg-[#004742] text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition-all">
        <span class="material-symbols-outlined text-base">add</span>
        <span>Đặt Đơn Mới</span>
      </a>
    </div>
  </header>

  <!-- Content Container -->
  <main class="max-w-7xl mx-auto px-4 md:px-8 py-8 w-full flex-1 space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Lịch Hẹn Của Tôi</h1>
        <p class="text-xs md:text-sm text-slate-500 mt-1">Quản lý các ca làm việc đang diễn ra, lịch hẹn sắp tới và lịch sử đánh giá dịch vụ</p>
      </div>

      <!-- Filter Tabs -->
      <div class="flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-2xl border border-slate-200 self-start sm:self-auto">
        <button type="button" data-tab="all" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold transition-colors bg-[#005c55] text-white shadow-xs cursor-pointer">
          Tất cả
        </button>
        <button type="button" data-tab="upcoming" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold transition-colors text-slate-600 hover:bg-slate-200 cursor-pointer">
          Đang làm & Sắp tới
        </button>
        <button type="button" data-tab="completed" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold transition-colors text-slate-600 hover:bg-slate-200 cursor-pointer">
          Hoàn thành
        </button>
      </div>
    </div>

    <!-- Appointments Cards List -->
    <div id="appointments-list" class="space-y-4">
      <!-- Dynamically Rendered by appointments.js -->
    </div>
  </main>

  <!-- Scripts -->
  <script type="module">
    import { initPlatformSwitcher } from './js/components/platformSwitcher.js';
    initPlatformSwitcher();
    if (window.lucide) window.lucide.createIcons();
  </script>
  <script type="module" src="./js/pages/appointments.js"></script>
</body>
</html>
