<!doctype html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xét Duyệt Hồ Sơ KYC Đối Tác - Gia Đình Xanh Admin</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind Play CDN with Theme Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#005c55',
              dark: '#004742',
              light: '#007a71',
              50: '#e6f5f3'
            },
            secondary: {
              DEFAULT: '#a73a00',
              dark: '#852e00',
              light: '#c74700'
            },
            surface: '#faf8ff'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/animations.css" />
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans pb-16">

  <!-- Top Admin Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="admin-dashboard.html" class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-[#005c55] flex items-center justify-center text-white shadow-md">
            <span class="material-symbols-outlined text-xl">verified_user</span>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-extrabold text-base tracking-tight">GIA ĐÌNH XANH</span>
              <span class="bg-[#005c55] text-emerald-200 text-[10px] uppercase font-black px-2 py-0.5 rounded tracking-wider">KYC VERIFICATION</span>
            </div>
            <div class="text-[11px] text-slate-400">Thẩm Định Hồ Sơ & Sát Hạch Đối Tác 5 Sao</div>
          </div>
        </a>

        <!-- Admin Nav Links -->
        <nav class="hidden md:flex items-center gap-2 ml-8 text-xs font-bold">
          <a href="admin-dashboard.html" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-colors">Tổng Quan Đơn Hàng</a>
          <a href="admin-pricing.html" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-colors">Cấu Hình Biểu Giá</a>
          <a href="admin-kyc.html" class="px-3 py-1.5 rounded-lg bg-white/10 text-white">Thẩm Định KYC (4 Chờ)</a>
        </nav>
      </div>

      <!-- Quick Counter -->
      <div class="flex items-center gap-2 bg-emerald-950 border border-emerald-700/50 px-3 py-1.5 rounded-full text-xs font-bold text-emerald-300">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>4 Hồ sơ đang chờ thẩm định</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-1 space-y-6">

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <!-- Left Column: Candidates List -->
      <div class="lg:col-span-4 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="font-extrabold text-slate-900 text-sm">Danh Sách Ứng Viên</h2>
          <span class="text-xs text-slate-500 font-semibold">Tự động sắp xếp theo giờ nộp</span>
        </div>

        <div id="kyc-candidates-list" class="space-y-2.5">
          <!-- Rendered by adminKyc.js -->
        </div>
      </div>

      <!-- Right Column: Verification Dossier & Evidence -->
      <div class="lg:col-span-8">
        <div id="kyc-details-container" class="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200 shadow-sm space-y-5">
          <!-- Rendered by adminKyc.js -->
        </div>
      </div>

    </div>

  </main>

  <!-- Scripts -->
  <script type="module">
    import { initPlatformSwitcher } from './js/components/platformSwitcher.js';
    initPlatformSwitcher();
    if (window.lucide) window.lucide.createIcons();
  </script>
  <script type="module" src="./js/pages/adminKyc.js"></script>
</body>
</html>
